# DEMO ONLY. These are placeholder values, not real credentials — replace them (and the
# base64 encoding) before applying. In a real deployment this file wouldn't be committed
# with filled-in values at all; you'd use `kubectl create secret generic ... --from-literal`
# or a proper secrets manager (sealed-secrets, external-secrets, AWS Secrets Manager, etc.)
# instead of a plaintext-in-git manifest. It's here as a demo purely to show the wiring:
# deployment.yaml never sees these values directly, only the Secret's name.
#
# stringData (not data) is used below so the demo doesn't require pre-base64-encoding
# anything by hand — Kubernetes encodes it on apply. Real secret material still ends up
# base64 (i.e. NOT encrypted) at rest in etcd either way, same caveat as any plain Secret.
apiVersion: v1
kind: Secret
metadata:
  name: ledger-core-secrets
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: "bank_user"
  SPRING_DATASOURCE_PASSWORD: "changeme-replace-with-the-real-db-password"
  # Must be a real, random 32+ byte value in anything beyond this demo — see the comment
  # on app.jwt.secret in application.properties.
  JWT_SECRET: "changeme-replace-with-a-real-32-byte-minimum-secret"

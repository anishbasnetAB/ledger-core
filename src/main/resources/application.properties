spring.application.name=bank


spring.datasource.url=jdbc:postgresql://localhost:5433/bank
spring.datasource.username=bank_user
spring.datasource.password=bank_password123

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# CORS: comma-separated origins/patterns allowed to call the API from a browser.
# Defined in the base config (not only the prod profile) so CORS_ALLOWED_ORIGINS is
# honored regardless of which Spring profile is active. Patterns support a '*' wildcard
# in the host, so Vercel preview deployments (fresh URL each push) are covered.
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://ledger-core-frontend-gamma.vercel.app,https://ledger-core-frontend-*.vercel.app}

# JWT: same reasoning as CORS above — Render never activates the prod profile, so this
# lives in the base config behind an env-var default. Set a real JWT_SECRET in prod.
app.jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-please-32-bytes-min}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# Kafka producer bootstrap: transfer.completed events (see KafkaProducerConfig /
# TransferEventPublisher). Only this is externalized — serializers, acks=all, and the
# max.block.ms safety net are fixed design choices, not per-environment knobs, so they're
# set directly in KafkaProducerConfig rather than duplicated here.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Redis: balance-cache reads/evictions (BalanceService) and the rate-limit counters
# (RateLimitFilter). Short timeouts, not the multi-second Lettuce default — both uses are
# best-effort and must fail fast rather than stall a request if Redis is unreachable.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=2000ms

# Balance cache TTL lives as a constant in BalanceService (a fixed design choice, not a
# per-environment knob — see the comment there).

# Rate limits: sane per-portfolio-project defaults, not measured production numbers.
# Login is stricter than transfers on purpose — it's the more attractive brute-force target.
app.ratelimit.login.max-requests=${RATE_LIMIT_LOGIN_MAX:5}
app.ratelimit.login.window-seconds=${RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
app.ratelimit.transfer.max-requests=${RATE_LIMIT_TRANSFER_MAX:20}
app.ratelimit.transfer.window-seconds=${RATE_LIMIT_TRANSFER_WINDOW_SECONDS:60}

services:
  postgres:
    image: postgres:16
    container_name: bank-postgres
    environment:
      POSTGRES_DB: bank
      POSTGRES_USER: bank_user
      POSTGRES_PASSWORD: bank_password123
    ports:
      - "5433:5432"
    volumes:
      - bank-postgres-data:/var/lib/postgresql/data

  # Database-per-service: ledger-notifier (a separate app, see ../ledger-notifier) owns its
  # processed_events table here rather than living inside the bank database.
  notifier-postgres:
    image: postgres:16
    container_name: ledger-notifier-postgres
    environment:
      POSTGRES_DB: ledger_notifier
      POSTGRES_USER: notifier_user
      POSTGRES_PASSWORD: notifier_password123
    ports:
      - "5434:5432"
    volumes:
      - notifier-postgres-data:/var/lib/postgresql/data

  # Single-broker KRaft Kafka (no Zookeeper) — plenty for local dev/demo purposes.
  # Official apache/kafka image, since it's KRaft-ready out of the box.
  kafka:
    image: apache/kafka:3.9.0
    container_name: bank-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # Balance-read cache + rate-limit counters (BalanceService, RateLimitFilter). No
  # persistence configured — both uses are fine losing their data on a restart.
  redis:
    image: redis:7
    container_name: bank-redis
    ports:
      - "6379:6379"

volumes:
  bank-postgres-data:
  notifier-postgres-data: